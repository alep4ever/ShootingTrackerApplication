server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,com.flowingcode,com.example.application
spring.jpa.defer-datasource-initialization = true
spring.sql.init.mode = always

# db connection

spring.datasource.url=jdbc:mysql://database-4.chpnsrbslevo.us-east-1.rds.amazonaws.com:3306/lab4?createDatabaseIfNotExist=true
spring.datasource.username=admin
spring.datasource.password=lab-password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# File upload configuration
# These settings control how large files can be uploaded to your application
# max-file-size: The maximum size allowed for a single uploaded file
# max-request-size: The maximum size allowed for the entire HTTP request (useful when uploading multiple files)
# 50MB should be enough for short demonstration videos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB